output_dir = "/workspace/k2ab/checkpoints/B_beta1_fixed_fp8_512_micro2_probe"
dataset = "/workspace/k2ab/artifacts/fp8_512/configs/B_beta1_fixed_probe_dataset.toml"
epochs = 1000
max_steps = 250
micro_batch_size_per_gpu = 2
gradient_accumulation_steps = 1
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 50
save_every_n_steps = 125
checkpoint_every_n_minutes = 60
activation_checkpointing = true
save_dtype = "bfloat16"
caching_batch_size = 1
seed = 42

[model]
type = "krea2_multiref_grounded"
diffusion_model = "/workspace/models/krea2/diffusion_models/krea2_raw_fp8_scaled.safetensors"
vae = "/workspace/models/krea2/vae/qwen_image_vae.safetensors"
dtype = "bfloat16"
base_quant = "fp8_scaled"
timestep_sample_method = "logit_normal"
