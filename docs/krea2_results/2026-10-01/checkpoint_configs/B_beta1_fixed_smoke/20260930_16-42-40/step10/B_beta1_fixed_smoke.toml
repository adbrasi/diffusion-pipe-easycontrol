output_dir = "/workspace/k2ab/checkpoints/B_beta1_fixed_smoke"
dataset = "/workspace/k2ab/artifacts/configs/B_beta1_fixed_smoke_dataset.toml"
epochs = 1000
max_steps = 10
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 4
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 5
save_every_n_steps = 5
checkpoint_every_n_minutes = 60
activation_checkpointing = true
save_dtype = "bfloat16"
caching_batch_size = 1
blocks_to_swap = 20
seed = 42
checkpoint_every_n_epochs = 1

[model]
type = "krea2_multiref_grounded"
diffusion_model = "/workspace/models/krea2/diffusion_models/krea2_raw_bf16.safetensors"
vae = "/workspace/models/krea2/vae/qwen_image_vae.safetensors"
dtype = "bfloat16"
diffusion_model_dtype = "bfloat16"
timestep_sample_method = "logit_normal"
flux_shift = true
[[model.text_encoders]]
path = "/workspace/models/krea2/text_encoders/qwen3vl_4b_bf16.safetensors"
type = "krea2"

[krea2_multiref_grounded]
max_refs = 1
slot_axis = "width"
position_mode = "width_shift"
reference_position_offset = 1.0
reference_timestep = "zero"
condition_dropout = 0.0
condition_only_lora = true
vl_prompt_style = "picture_n"
vl_image_label = "image"
vl_image_max_pixels = 147456
caption_dropout = 0.0
txtfusion_rank = 128

[adapter]
type = "lora"
rank = 64
dtype = "bfloat16"

[optimizer]
type = "AdamW8bitKahan"
lr = 0.0001
betas = [ 0.9, 0.99,]
weight_decay = 0.01
stabilize = false
