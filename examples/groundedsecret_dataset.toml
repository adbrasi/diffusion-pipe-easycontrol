# GROUNDEDSECRET — dataset multi-resolução para o treino sério do omini-grounded.
# Fontes são 1080p nativas; treinamos em 3 escalas de área (AR buckets) para não
# ficar preso a ~600px na inferência. flux_shift ajusta o mu por resolução.
resolutions = [512, 768, 1024]
enable_ar_bucket = true
min_ar = 0.5
max_ar = 2.0
num_ar_buckets = 9
frame_buckets = [1]

[[directory]]
path = '/workspace/datasets/contexto_rush/input_B'
control_path = '/workspace/datasets/contexto_rush/input_A'
num_repeats = 1
