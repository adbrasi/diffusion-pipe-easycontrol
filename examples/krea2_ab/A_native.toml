# Krea 2 A/B — BRAÇO A: contrato NATIVO do ComfyUI (roda sem node custom).
# Inferência: UNETLoader -> LoraLoaderModelOnly -> TextEncodeQwenImageEditPlus(clip, vae, image1)
#             -> FluxKontextMultiReferenceLatentMethod('index_timestep_zero') -> sampler.
# Pré-requisitos: tools/krea2_native_parity.py (forward E te-*) passando. Ver
# docs/HANDOFF_KREA2_AB.md e docs/KREA2_ANALISE_METODO_2026-09.md.
# Diferenças para o B: SÓ o contrato (posição/ref/texto/LoRA global). Dados, resolução,
# steps, lr, otimizador, schedule e base iguais.

output_dir = '/workspace/k2ab/checkpoints/A_native'
dataset = 'examples/krea2_ab/dataset_A_native.toml'
epochs = 1000
max_steps = 500
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 4
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 50
save_every_n_steps = 250
checkpoint_every_n_minutes = 60
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 1
blocks_to_swap = 16            # medir no smoke; subir se OOM (bf16 exato ocupa ~26 GB de pesos)
seed = 42

[model]
type = 'krea2_native'
# Base com a NUMÉRICA CERTA: bf16 (o fp8 re-quantizado do beta1 zerava até ~27% dos pesos).
diffusion_model = '/workspace/models/krea2/diffusion_models/krea2_raw_bf16.safetensors'
vae = '/workspace/models/krea2/vae/qwen_image_vae.safetensors'
text_encoders = [
    {path = '/workspace/models/krea2/text_encoders/qwen3vl_4b_bf16.safetensors', type = 'krea2'},
]
dtype = 'bfloat16'
diffusion_model_dtype = 'bfloat16'
timestep_sample_method = 'logit_normal'
flux_shift = true

[krea2_native]
reference_timestep = 'zero'    # = index_timestep_zero
vl_grounding = true            # TextEncodeQwenImageEditPlus (false = CLIPTextEncode + ReferenceLatent)
caption_dropout = 0.0          # legenda vazia + ref limpa ensina a copiar

[adapter]
type = 'lora'
rank = 64
dtype = 'bfloat16'

[optimizer]
type = 'AdamW8bitKahan'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
stabilize = false
