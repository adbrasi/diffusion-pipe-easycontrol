output_dir = '/workspace/ideogram4_ominicontrol2_output'
dataset = 'examples/ideogram4_reference_dataset.toml'
epochs = 1000
max_steps = 7000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 4
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 100
save_every_n_steps = 250
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 1
blocks_to_swap = 8

[model]
type = 'ideogram4_ominicontrol2'
diffusion_model = '/workspace/models/ideogram4_fp8_scaled.safetensors'
vae = '/workspace/models/flux2-vae.safetensors'
text_encoders = [
    {path = '/workspace/models/qwen3vl_8b_fp8_scaled.safetensors', type = 'ideogram4'},
]
dtype = 'bfloat16'
diffusion_model_dtype = 'float8'
timestep_sample_method = 'logit_normal'
shift = 3

[ominicontrol]
condition_only_lora = true
position_mode = 'spatial'
condition_dropout = 0.1
reference_model_timestep = 1.0
independent_condition = true
# Encodes the condition at half pixel resolution: stride 2 means ~4x fewer ref tokens.
condition_token_stride = 2
# Maps compact reference coordinates back onto the target coordinate scale.
reference_position_scale = 2.0

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'AdamW8bitKahan'
lr = 5e-5
betas = [0.9, 0.99]
weight_decay = 0.01
stabilize = false
