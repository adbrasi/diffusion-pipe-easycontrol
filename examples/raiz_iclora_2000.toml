# RAIZ IC-LORA — réplica do v2 s1950 de abril (o melhor adapter do usuário),
# no dataset de abril. INFERÊNCIA: sempre com skip_adaln.
output_dir = '/workspace/checkpoints/anima_raiz_iclora'
dataset = '/workspace/configs/raiz_abril_dataset.toml'
epochs = 1000
max_steps = 2000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 8
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 50
save_every_n_steps = 250
checkpoint_every_n_minutes = 60
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 4
partition_method = 'parameters'

[model]
type = 'raiz_iclora'
transformer_path = '/workspace/models_anima/split_files/diffusion_models/anima-base-v1.0.safetensors'
vae_path = '/workspace/models/qwen_image_vae.safetensors'
llm_path = '/workspace/models_anima/split_files/text_encoders/qwen_3_06b_base.safetensors'
dtype = 'bfloat16'
sigmoid_scale = 1.3

[ic_lora_full]
ref_first = true
condition_dropout = 0.1
condition_timestep = 0.0
shifted_logit_normal = true
min_tokens = 1024
max_tokens = 4096
min_shift = 0.95
max_shift = 2.05

[adapter]
type = 'lora'
rank = 64
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
