# Ideogram 4 reference-conditioned IC-LoRA pilot for a single RTX 5090.
# Start at 512px to validate the full cache -> train -> save contract before 1024px.

output_dir = '/workspace/ideogram4_ic_lora_output'
dataset = 'examples/ideogram4_ic_lora_dataset.toml'

epochs = 1000
max_steps = 7000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 4
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 100

save_every_n_steps = 250
checkpoint_every_n_minutes = 120
activation_checkpointing = true
partition_method = 'parameters'
save_dtype = 'bfloat16'
caching_batch_size = 1
steps_per_print = 1

# The reference doubles image-token sequence length. Increase this if 1024px
# does not fit; the Ideogram 4 implementation allows at most 32 swapped blocks.
blocks_to_swap = 8

[model]
type = 'ideogram4_ic_lora'
diffusion_model = '/workspace/models/ideogram4_fp8_scaled.safetensors'
vae = '/workspace/models/flux2-vae.safetensors'
text_encoders = [
    {path = '/workspace/models/qwen3vl_8b_fp8_scaled.safetensors', type = 'ideogram4'},
]
dtype = 'bfloat16'
diffusion_model_dtype = 'float8'
timestep_sample_method = 'logit_normal'
shift = 3

[ideogram4_ic_lora]
# Keeps the reference slots but zeros the latent content for CFG-style training.
condition_dropout = 0.1
# Working Ideogram precedent: target at native image time, reference at +1.
reference_position_offset = 1
# Ideogram's internal convention is inverted: 1.0 means a clean token.
reference_model_timestep = 1.0

[adapter]
type = 'lora'
rank = 64
dtype = 'bfloat16'

[optimizer]
type = 'AdamW8bitKahan'
lr = 5e-5
betas = [0.9, 0.99]
weight_decay = 0.01
stabilize = false
