# anima_nextscene FULL RUN — launch with the geometry that won the probe (default: disjoint_w).
# Budget: judge the method only after it has seen the data ~1-2 times. With ~40k filtered
# pairs x 4 samples/step, 40k steps ~= 4 epochs; evaluate every 1000 with
# tools/nextscene_eval.py and keep the best checkpoint by ref_gain / copy_rate / eye,
# not the last one. AnimaRefLora saw its copy phase peak (~95K steps, batch 1) and then
# recede with the anti-copy recipe ON — watch the copy_rate TREND before stopping.
# Optional last stage: resume at 768/1024 for 10-20% of the steps (Krea 2 saga: detail
# improves a lot at high res; the task itself is resolution independent).
# Resume warning (Krea 2 saga §6.1): a DeepSpeed resume restores the OLD lr — check the log.

output_dir = '/workspace/checkpoints/anima_nextscene/full_run'
dataset = 'examples/anima_nextscene/dataset.toml'
epochs = 1000
max_steps = 40000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 4
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 100
save_every_n_steps = 1000
checkpoint_every_n_minutes = 60
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 4
partition_method = 'parameters'

[model]
type = 'anima_nextscene'
# Anima Base v1.0 — every working community adapter is verified on it (not preview2).
transformer_path = '/workspace/models_anima/split_files/diffusion_models/anima-base-v1.0.safetensors'
vae_path = '/workspace/models_anima/split_files/vae/qwen_image_vae.safetensors'
llm_path = '/workspace/models_anima/split_files/text_encoders/qwen_3_06b_base.safetensors'
dtype = 'bfloat16'
timestep_sample_method = 'logit_normal'
sigmoid_scale = 1.0          # no training shift (official Anima advice); shift 3 only at inference

[nextscene]
rope_layout = 'disjoint_w'
ref_temporal_index = 1
ref_dropout = 0.1            # trained null -> ref_cfg dial; also blocks "ref always there" coupling
lora_cross_attn = true       # Round-1 winner scope (self_attn + mlp + cross_attn); llm_adapter/adaln never
diff_weight = true           # copied regions weigh 0.2, changed regions > 1 (mean kept at 1)
high_noise_prob = 0.2        # 20% of steps at sigma in [0.8, 1]: the band that decides composition
ref_hflip_prob = 0.0
ref_noise_prob = 0.0

[adapter]
type = 'lora'
rank = 64
alpha = 64
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 5e-5
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
