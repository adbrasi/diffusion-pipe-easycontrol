# FIRA — sonda de 300 steps (arquitetura ideal do round E do Codex)
# [capsula identidade 8 | delta caption | alvo | ref VAE compacta]

output_dir = '/workspace/ideogram4_ctxrush_fira_output'
dataset = '/workspace/configs/ideogram4_ctxrush_fira_dataset.toml'

epochs = 1000
max_steps = 300
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 4
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 25

save_every_n_steps = 50
checkpoint_every_n_minutes = 120
activation_checkpointing = true
partition_method = 'parameters'
save_dtype = 'bfloat16'
caching_batch_size = 1
steps_per_print = 1

blocks_to_swap = 8

[model]
type = 'ideogram4_identity_nextscene'
diffusion_model = '/workspace/models/ideogram4_bf16.safetensors'
vae = '/workspace/models/flux2-vae.safetensors'
text_encoders = [
    {path = '/workspace/models/qwen3vl_8b_fp8_scaled.safetensors', type = 'ideogram4'},
]
dtype = 'bfloat16'
diffusion_model_dtype = 'bfloat16'
timestep_sample_method = 'logit_normal'
shift = 3

[identity_nextscene]
identity_capsule_tokens = 8
vl_longest_side = 224
vae_reference_scale = 0.5
vae_reference_dropout = 0.5
identity_rank = 8
adaln_rank = 8

[ominicontrol]
condition_only_lora = false
position_mode = 'subject'
condition_dropout = 0.0
reference_model_timestep = 1.0
independent_condition = true
condition_token_stride = 2
reference_position_scale = 2.0

[ideogram4_ic_lora]
train_adaln_modulation = true
reference_position_offset = 1

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'AdamW8bitKahan'
lr = 5e-5
betas = [0.9, 0.99]
weight_decay = 0.01
stabilize = false
