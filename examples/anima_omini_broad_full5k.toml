# TREINO COMPLETO 5K 'omini_broad' — escopo largo (cross_attn+llm_adapter, adaln fora),
# dataset bilíngue (natural + tags WD14 invertido). Batch 8, rank 32, lr 1e-4.
output_dir = '/workspace/checkpoints/anima_omini_broad_full5k'
dataset = '/workspace/configs/ctx_dual_lang_dataset.toml'
epochs = 1000
max_steps = 5000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 8
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 50
save_every_n_steps = 500
checkpoint_every_n_minutes = 60
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 4
partition_method = 'parameters'

[model]
type = 'ominicontrol_broad'
transformer_path = '/workspace/models_anima/split_files/diffusion_models/anima-base-v1.0.safetensors'
vae_path = '/workspace/models/qwen_image_vae.safetensors'
llm_path = '/workspace/models_anima/split_files/text_encoders/qwen_3_06b_base.safetensors'
dtype = 'bfloat16'
sigmoid_scale = 1.0

[ic_lora_full]
ref_first = false
condition_dropout = 0.1
condition_timestep = 0.0
shifted_logit_normal = false
include_adaln = false

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
