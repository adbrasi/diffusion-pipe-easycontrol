# GROUNDEDSECRET — treino sério do krea2_omini_grounded (7000 steps).
# Método validado no probe 250 + melhorias mapeadas em docs/OMINI_GROUNDED_SEGREDO.md:
#   - caption_dropout 0.1 (treina o uncond grounded do CFG)
#   - vl_grounding_jitter 384-768 (dial de inferência robusto)
#   - multi-resolução 512/768/1024 (dataset é 1080p nativo)
output_dir = '/workspace/checkpoints/groundedsecret_7k'
dataset = '/workspace/configs/groundedsecret_dataset.toml'
epochs = 1000
max_steps = 7000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 4
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 100
save_every_n_steps = 500
checkpoint_every_n_minutes = 60
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 1
blocks_to_swap = 8

[model]
type = 'krea2_omini_grounded'
diffusion_model = '/workspace/models/krea2_raw_fp8_scaled.safetensors'
vae = '/workspace/models/qwen_image_vae.safetensors'
text_encoders = [
    {path = '/workspace/models/qwen3vl_4b_bf16.safetensors', type = 'krea2'},
]
dtype = 'bfloat16'
diffusion_model_dtype = 'float8'
timestep_sample_method = 'logit_normal'
flux_shift = true

[krea2_omini_grounded]
position_mode = 'width_shift'
reference_position_offset = 1.0
reference_timestep = 'zero'
condition_dropout = 0.0
condition_only_lora = true
vl_prompt_style = 'plain'
vl_longest_side = 768
vl_grounding_jitter = [384, 768]
caption_dropout = 0.1

[adapter]
type = 'lora'
rank = 64
dtype = 'bfloat16'

[optimizer]
type = 'AdamW8bitKahan'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
stabilize = false
