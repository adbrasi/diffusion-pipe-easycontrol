# RODADA 2 — ARM A: campeão da Rodada 1 (Arm 1: llm_adapter_lr=0, escopo
# largo, target-first) + adaln DENTRO do LoRA (include_adaln=true).
# Testa se o "para-raios" (adaln absorvendo gradiente de ajuste global,
# descartado na inferência via --skip_adaln) ajuda além do que o campeão
# já entrega. Única variável mudada vs arm1_broad_llm_frozen.toml.
#
# ATENÇÃO NA INFERÊNCIA: este checkpoint tem LoRA em adaln_modulation —
# usar sempre --skip_adaln no infer_easycontrol.py / battery_eval.sh,
# senão double-LoRA sobre o adaln_lora nativo do Cosmos-Predict2 causa
# instabilidade (ver docs/BATERIA_2026-07-25_LLM_ADAPTER.md).

output_dir = '/workspace/checkpoints/round2_2026-07-25/armA_adaln_in'
dataset = 'examples/battery_2026-07-25/anima_battery_dataset.toml'
epochs = 1000
max_steps = 1000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 8
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 25
save_every_n_steps = 250
checkpoint_every_n_minutes = 30
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 4
partition_method = 'parameters'

[model]
type = 'ic_lora_v3'
transformer_path = '/workspace/models_anima/split_files/diffusion_models/anima-base-v1.0.safetensors'
vae_path = '/workspace/models/qwen_image_vae.safetensors'
llm_path = '/workspace/models_anima/split_files/text_encoders/qwen_3_06b_base.safetensors'
dtype = 'bfloat16'
sigmoid_scale = 1.0
llm_adapter_lr = 0   # fixo: receita vencedora da Rodada 1

[ic_lora_full]
ref_first = false
condition_dropout = 0.0
condition_timestep = 0.0
shifted_logit_normal = false
include_adaln = true   # <-- variável do experimento (Arm A: adaln dentro)

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
