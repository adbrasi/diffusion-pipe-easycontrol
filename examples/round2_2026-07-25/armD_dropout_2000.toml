# RODADA 2 — ARM D: dropout 0.1 em treino LONGO (2000 steps).
# Testa diretamente a conclusão tirada das métricas: o dropout não melhora
# o teto, ele PROTEGE contra a degradação em treino longo. Se estiver
# certo, o Arm D deve manter (ou melhorar) sensibilidade/fidelidade em
# 1250-2000 steps, enquanto o Arm 1 (dropout 0.0) já colapsou em 1000.
# Se o Arm D também degradar, a proteção do dropout é só um adiamento.
# Checkpoints a cada 250 para ver a curva inteira.

output_dir = '/workspace/checkpoints/round2_2026-07-25/armD_dropout_2000'
dataset = 'examples/battery_2026-07-25/anima_battery_dataset.toml'
epochs = 1000
max_steps = 2000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 8
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 25
save_every_n_steps = 250
checkpoint_every_n_minutes = 60
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 4
partition_method = 'parameters'

[model]
type = 'ic_lora_v3'
transformer_path = '/workspace/models_anima/split_files/diffusion_models/anima-base-v1.0.safetensors'
vae_path = '/workspace/models/qwen_image_vae.safetensors'
llm_path = '/workspace/models_anima/split_files/text_encoders/qwen_3_06b_base.safetensors'
dtype = 'bfloat16'
sigmoid_scale = 1.0
llm_adapter_lr = 0

[ic_lora_full]
ref_first = false
condition_dropout = 0.1
condition_timestep = 0.0
shifted_logit_normal = false
include_adaln = false

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
