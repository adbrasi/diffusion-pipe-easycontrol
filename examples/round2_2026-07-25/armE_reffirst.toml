# RODADA 2 — ARM E: ref_first = TRUE (ordem [ref T=0 | alvo T=1]).
# Único eixo mudado vs o campeão arm1 (que usa target-first
# [alvo T=0 | ref T=1], o contrato do V1 de abril).
#
# Por que vale testar: a ordem do pacote é uma AMBIGUIDADE ANTIGA da saga
# (ver docs/ANIMA_SAGA_COMPLETA.md item 10 — o workflow de abril tinha
# ref_first DESLIGADO no node, mas nunca ficou claro se o adapter foi
# treinado assim). ref_first=true é a convenção LTX-2 (referência recebe
# as posições temporais mais baixas). Como o RoPE do Anima é RELATIVO,
# a teoria diz que a ordem deveria importar pouco — este braço testa isso
# empiricamente pela primeira vez nesta bateria.
#
# ATENÇÃO NA AVALIAÇÃO: adapter treinado com ref_first=true precisa ser
# inferido com MODE=ic_lora_full (concat [ref|alvo]), NÃO com
# ominicontrol_subject (concat [alvo|ref]). Usar o modo errado invalida
# o teste. Ver tools/battery_eval.sh.

output_dir = '/workspace/checkpoints/round2_2026-07-25/armE_reffirst'
dataset = 'examples/battery_2026-07-25/anima_battery_dataset.toml'
epochs = 1000
max_steps = 1000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 8
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 25
save_every_n_steps = 250
checkpoint_every_n_minutes = 30
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 4
partition_method = 'parameters'

[model]
type = 'ic_lora_v3'
transformer_path = '/workspace/models_anima/split_files/diffusion_models/anima-base-v1.0.safetensors'
vae_path = '/workspace/models/qwen_image_vae.safetensors'
llm_path = '/workspace/models_anima/split_files/text_encoders/qwen_3_06b_base.safetensors'
dtype = 'bfloat16'
sigmoid_scale = 1.0
llm_adapter_lr = 0

[ic_lora_full]
ref_first = true          # <-- variável do experimento (campeão usa false)
condition_dropout = 0.0
condition_timestep = 0.0
shifted_logit_normal = false
include_adaln = false

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
