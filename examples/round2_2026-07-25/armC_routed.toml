# RODADA 2 — ARM C: campeão vigente + routing condition-only no canal de
# aparência (self_attn+mlp roteado só pras rows da referência, zero-drift
# no alvo) enquanto cross_attn+llm_adapter continuam globais — o análogo
# Anima do omini-grounded do Krea2. `models/ic_lora_dual.py::ICLoraDualPipeline`.
# Baseline = vencedor acumulado dos testes A e B.

output_dir = '/workspace/checkpoints/round2_2026-07-25/armC_routed'
dataset = 'examples/battery_2026-07-25/anima_battery_dataset.toml'
epochs = 1000
max_steps = 1000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 8
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 25
save_every_n_steps = 250
checkpoint_every_n_minutes = 30
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 4
partition_method = 'parameters'

[model]
type = 'ic_lora_dual'
transformer_path = '/workspace/models_anima/split_files/diffusion_models/anima-base-v1.0.safetensors'
vae_path = '/workspace/models/qwen_image_vae.safetensors'
llm_path = '/workspace/models_anima/split_files/text_encoders/qwen_3_06b_base.safetensors'
dtype = 'bfloat16'
sigmoid_scale = 1.0
llm_adapter_lr = 0

[ic_lora_full]
ref_first = false
condition_dropout = 0.0   # ajustar para o valor vencedor do Arm B se >0.0 vencer
condition_timestep = 0.0
shifted_logit_normal = false
include_adaln = false     # ajustar se Arm A vencer
condition_only_lora = true   # <-- variável do experimento (Arm C: routing no canal de aparência)

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
