# Braço A/B: krea2_ominicontrol (condition-only LoRA) — probe de 250 steps, lr 1e-4.
# position_mode 'subject' (referência NÃO alinhada espacialmente — próxima cena),
# igual à geometria dos demais braços; o default 'spatial' do exemplo é para
# controles alinhados (canny/depth).
output_dir = '/workspace/krea2_omini_true_output'
dataset = '/workspace/configs/contexto_rush_dataset.toml'
epochs = 1000
max_steps = 250
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 4
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 50
save_every_n_steps = 250
checkpoint_every_n_minutes = 30
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 1
blocks_to_swap = 8

[model]
type = 'krea2_ominicontrol'
diffusion_model = '/workspace/models/krea2_raw_fp8_scaled.safetensors'
vae = '/workspace/models/qwen_image_vae.safetensors'
text_encoders = [
    {path = '/workspace/models/qwen3vl_4b_bf16.safetensors', type = 'krea2'},
]
dtype = 'bfloat16'
diffusion_model_dtype = 'float8'
timestep_sample_method = 'logit_normal'
flux_shift = true

[ominicontrol]
position_mode = 'width_shift'
reference_timestep = 'target'
reference_position_offset = 1.0
condition_only_lora = true
condition_dropout = 0.1

[adapter]
type = 'lora'
rank = 64
dtype = 'bfloat16'

[optimizer]
type = 'AdamW8bitKahan'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
stabilize = false
