# ANIMA IC-LORA V2 — probe 250 steps, dataset contexto_rush (next-scene).
# Base: anima-base-v1.0. ic_lora_v2 é o caminho PASS do audit (fix f85e808 +
# 2761a59): exclusões de adaln/cross_attn/llm_adapter, ref_first LTX-2
# [ref T=0, target T=1], loss só no target, shifted logit-normal adaptativo.
output_dir = '/workspace/checkpoints/anima_iclora_routed'
dataset = '/workspace/configs/contexto_rush_dataset.toml'
epochs = 1000
max_steps = 250
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 4
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 50
save_every_n_steps = 1000
checkpoint_every_n_minutes = 30
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 4
partition_method = 'parameters'

[model]
type = 'ic_lora_routed'
transformer_path = '/workspace/models_anima/split_files/diffusion_models/anima-base-v1.0.safetensors'
vae_path = '/workspace/models/qwen_image_vae.safetensors'
llm_path = '/workspace/models_anima/split_files/text_encoders/qwen_3_06b_base.safetensors'
dtype = 'bfloat16'
sigmoid_scale = 1.3
llm_adapter_lr = 0

[ic_lora_full]
ref_first = true
condition_dropout = 0.1
condition_only_lora = true
condition_timestep = 0.0
shifted_logit_normal = true
min_tokens = 1024
max_tokens = 4096
min_shift = 0.95
max_shift = 2.05

[adapter]
type = 'lora'
rank = 64
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
