# KREA2 edit saga 2026-07-29 — dataset combinado (pares A->B, N=1 referência)
#
# 512px no treino inicial: o cache de embeddings de texto é o gargalo real do
# projeto (docs/KREA2_MULTIREF_RECEITA.md §7.1). Grounding a 384² (config do
# modelo), medido no smoke antes do run longo.
resolutions = [1024]
enable_ar_bucket = true
min_ar = 0.5
max_ar = 2.0
num_ar_buckets = 7
frame_buckets = [1]

[[directory]]
path = '/workspace/datasets/prepared/recortados/target'
control_path = '/workspace/datasets/prepared/recortados/refs'
multi_ref = true
max_refs = 1
num_repeats = 1

