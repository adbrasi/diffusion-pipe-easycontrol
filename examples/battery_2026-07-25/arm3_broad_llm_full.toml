# BATERIA 2026-07-25 — ARM 3: broad scope, llm_adapter com LR CHEIO (= lr
# base, sem a linha llm_adapter_lr — herda o default). Isto é o que a
# "eureka" de julho pretendia testar, mas os probes reais
# (examples/anima_v3_500.toml / anima_dual_500.toml) tinham llm_adapter_lr=0
# por engano. Este arm corrige isso. Confirmar no log de startup:
# "Num llm_adapter params: N" com N>0 e llm_adapter_lr=0.0001 (não 0).
#
# Idêntico ao Arm 1/Arm 2 em tudo, exceto llm_adapter_lr (ausente = lr base).

output_dir = '/workspace/checkpoints/battery_2026-07-25/arm3_broad_llm_full'
dataset = 'examples/battery_2026-07-25/anima_battery_dataset.toml'
epochs = 1000
max_steps = 1000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 8
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 25
save_every_n_steps = 250
checkpoint_every_n_minutes = 30
activation_checkpointing = true
save_dtype = 'bfloat16'
caching_batch_size = 4
partition_method = 'parameters'

[model]
type = 'ic_lora_v3'
transformer_path = '/workspace/models_anima/split_files/diffusion_models/anima-base-v1.0.safetensors'
vae_path = '/workspace/models/qwen_image_vae.safetensors'
llm_path = '/workspace/models_anima/split_files/text_encoders/qwen_3_06b_base.safetensors'
dtype = 'bfloat16'
sigmoid_scale = 1.0
# llm_adapter_lr NÃO definido -> herda lr do [optimizer] (1e-4) via get_param_groups

[ic_lora_full]
ref_first = false
condition_dropout = 0.0
condition_timestep = 0.0
shifted_logit_normal = false
include_adaln = false

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
