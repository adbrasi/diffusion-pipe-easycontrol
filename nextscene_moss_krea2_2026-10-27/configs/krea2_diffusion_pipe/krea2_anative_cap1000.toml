# Krea 2 next-scene: user's krea2-a-native-lr0001 recipe (krea2_native, logit_normal + flux_shift, rank 64,
# effective batch 2, constant lr 1e-4) on the 1000 delta-caption pairs at 768px. Code: branch claude/elegant-ptolemy-8kywqy.
output_dir = "/workspace/checkpoints/krea2_anative_cap1000"
dataset = "/workspace/dpk/configs/dataset_cap1000_768_anative.toml"
eval_datasets = [ {name = 'heldout', config = '/workspace/dpk/configs/val_cap1000_768_anative.toml'} ]
eval_every_n_steps = 250
eval_before_first_step = true
eval_micro_batch_size_per_gpu = 1
eval_gradient_accumulation_steps = 1
epochs = 1000
max_steps = 1000
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 2
pipeline_stages = 1
gradient_clipping = 1.0
warmup_steps = 50
save_every_n_steps = 250
checkpoint_every_n_minutes = 30
activation_checkpointing = true
save_dtype = "bfloat16"
caching_batch_size = 1
seed = 42

[model]
type = "krea2_native"
diffusion_model = "/workspace/models/krea2/diffusion_models/krea2_raw_fp8_scaled.safetensors"
vae = "/workspace/models/krea2/vae/qwen_image_vae.safetensors"
dtype = "bfloat16"
base_quant = "fp8_scaled"
timestep_sample_method = "logit_normal"
flux_shift = true
blocks_to_swap = 0
[[model.text_encoders]]
path = "/workspace/models/krea2/text_encoders/qwen3vl_4b_bf16.safetensors"
type = "krea2"

[krea2_native]
reference_timestep = "zero"
vl_grounding = true
caption_dropout = 0.0
reference_pixels = "target"

[adapter]
type = "lora"
rank = 64
dtype = "bfloat16"

[optimizer]
type = "AdamW8bitKahan"
lr = 0.0001
betas = [ 0.9, 0.99,]
weight_decay = 0.01
stabilize = false
