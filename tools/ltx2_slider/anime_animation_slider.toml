# SLIDER: densidade temporal de animação (anime "on twos/threes" vs interpolado)
#
# PROBLEMA: o LTX anima anime fluido demais — parece material 60fps
# interpolado (RIFE/DAIN), com movimento contínuo. Anime de verdade é
# animado "on twos" (12 desenhos/s) ou "on threes" (8/s), com frames
# SEGURADOS e transições em pop entre poses-chave. Não é falta de amplitude
# de movimento: é excesso de DENSIDADE TEMPORAL — o modelo preenche os
# intervalos que a animação deixa vazios de propósito.
#
# POR QUE VÁRIOS [[targets]] DIZENDO A MESMA COISA: com batch_all_targets
# = true, todos os alvos entram no mesmo step e os gradientes são mediados.
# O que é COMUM às formulações (o conceito de densidade temporal) se
# reforça; o que é idiossincrático de cada frase se cancela. É a forma de
# separar o conceito da fraseologia. O doc é explícito que isso NÃO é
# equivalente a treinar mais steps: updates sequenciais são clipados
# separadamente e podem interferir, enquanto o batch reconcilia tudo num
# movimento só.
#
# CONVENÇÃO DE SINAL: positivo = MENOS densidade (mais stop-motion, mais
# anime tradicional). Então na inferência, multiplicador POSITIVO reduz a
# fluidez, NEGATIVO aumenta. Valores além de ±1 extrapolam.

mode = "text"
guidance_strength = 2.0
anchor_strength = 1.0
batch_all_targets = false        # sorteia 1 target por step: custo /5 (ver nota)
sample_slider_range = [-2.0, -1.0, 0.0, 1.0, 2.0]

# --- o mesmo conceito, cinco ângulos -----------------------------------

# 1. o vocabulário técnico da indústria de animação
[[targets]]
positive = "animated on twos, limited animation, held frames, low frame rate, stepped motion"
negative = "animated on ones, full animation, smooth interpolated motion, high frame rate"
target_class = "anime"
weight = 1.0

# 2. a descrição perceptual (sem jargão)
[[targets]]
positive = "choppy motion, stuttering movement, motion that snaps between poses"
negative = "fluid continuous motion, silky smooth movement, seamless motion blending"
target_class = "anime"
weight = 1.0

# 3. por analogia com técnicas vizinhas
[[targets]]
positive = "stop motion, frame-by-frame animation, keyframe poses with holds"
negative = "motion interpolated, frame blended, RIFE interpolation, optical flow smoothing"
target_class = "anime"
weight = 1.0

# 4. o defeito nomeado diretamente (o que queremos remover)
[[targets]]
positive = "traditional hand-drawn japanese animation timing, sparse in-betweens"
negative = "AI upscaled to 60fps, artificially smoothed anime, soap opera effect"
target_class = "anime"
weight = 1.0

# 5. pela contagem de desenhos
[[targets]]
positive = "12 drawings per second, few in-between frames, distinct pose changes"
negative = "60 frames per second, many in-between frames, gradual pose transitions"
target_class = "anime"
weight = 1.0

# --- âncoras: o que NÃO pode mudar --------------------------------------
#
# Regra do doc, contraintuitiva: uma boa âncora é um conceito ADJACENTE mas
# NÃO SOBRE o eixo do slider. Como este eixo é TEMPORAL, as âncoras têm que
# ser sobre QUALIDADE ESTÁTICA — assim o slider não pode "pagar" a mudança
# temporal degradando a imagem, que é o modo de falha mais provável aqui
# (confundir "poucos frames" com "vídeo ruim").

[[anchors]]
prompt = "a detailed anime illustration, sharp clean lineart, vibrant colors, high quality"

[[anchors]]
prompt = "a mountain valley at sunset, forest and rocks, no people"
